[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-risk-classification"
version = "0.1.0"
description = "Reproducible benchmark of TypeSafe Jev and classical models for transaction risk classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "typesafe-sdk>=0.1",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "pytest>=8.3",
]

[project.scripts]
jev-risk = "jev_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
